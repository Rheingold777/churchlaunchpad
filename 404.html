<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | ChurchLaunchpad</title>
  <meta name="description" content="The requested ChurchLaunchpad page could not be found. Continue to the homepage or browse church growth resources.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <style>
    :root { --navy: #1e293b; --blue: #3b82f6; --gold: #f59e0b; --cream: #fffaf0; --muted: #64748b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--navy); background: radial-gradient(circle at top, #dbeafe, var(--cream) 58%); }
    main { width: min(680px, 100%); padding: clamp(32px, 8vw, 72px); text-align: center; background: rgba(255,255,255,.94); border: 1px solid rgba(30,41,59,.1); border-radius: 24px; box-shadow: 0 24px 70px rgba(30,41,59,.14); }
    .mark { width: 72px; height: 72px; margin: 0 auto 22px; display: grid; place-items: center; border-radius: 20px; color: white; background: linear-gradient(135deg, var(--blue), #2563eb); font-size: 2rem; font-weight: 800; }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 7vw, 3.5rem); }
    p { margin: 0 auto 28px; max-width: 520px; color: var(--muted); line-height: 1.7; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    a { display: inline-block; padding: 12px 20px; border-radius: 9px; color: white; text-decoration: none; font-weight: 700; background: var(--blue); }
    a.secondary { color: var(--navy); background: transparent; border: 1px solid rgba(30,41,59,.25); }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">CL</div>
    <h1>Page Not Found</h1>
    <p>The page may have moved or the address may be incomplete. Choose a trusted route below to continue.</p>
    <nav aria-label="Page recovery">
      <a href="/">Homepage</a>
      <a href="/blog" class="secondary">Resources</a>
      <a href="/privacy" class="secondary">Privacy</a>
    </nav>
  </main>
</body>
</html>
